name: Deploy Go application

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Create .env file
        run: echo "HttpPort=${{ secrets.HTTPPORT }}" >> .env

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERPWD }}" | docker login -u "${{ secrets.DOCKERUSERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t sagar2175/aws-practice:latest .

      - name: Push image to Docker Hub
        run: docker push sagar2175/aws-practice:latest


  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Pull Docker image
        run: docker pull sagar2175/aws-practice:latest

      - name: Remove old container
        run: docker rm -f go-app-container || true

      - name: Run Docker container
        run: docker run -d --name go-app-container -p 4040:4040 sagar2175/aws-practice:latest